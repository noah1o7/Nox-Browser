<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht erreichbar</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #131416; color: #e9e9e6;
      font: 15px/1.5 system-ui, sans-serif;
      padding: 20vh 24px 24px;
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { color: #9c9da3; word-break: break-word; }
    b { color: #e9e9e6; font-weight: 600; }
    .fehler { font: 12px/1.5 ui-monospace, monospace; margin-top: 12px; }
    button {
      margin-top: 24px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
      background: #e8a33d; color: #131416; font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Seite nicht erreichbar</h1>
    <p><b>{{HOST}}</b> konnte nicht geladen werden. Prüfe deine Internetverbindung.</p>
    <p class="fehler">{{FEHLER}}</p>
    <button id="nochmal" data-url="{{URL}}">Nochmal versuchen</button>
  </main>
  <script>
    document.getElementById('nochmal').addEventListener('click', function () {
      location.href = this.dataset.url;
    });
  </script>
</body>
</html>
